name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 准备 7-Zip
        run: |
          set -eux
          curl -fsSL -o /tmp/7z.tar.xz https://www.7-zip.org/a/7z2501-linux-x64.tar.xz
          mkdir -p /opt/7z
          tar -xJf /tmp/7z.tar.xz -C /opt/7z 7zz
          chmod +x /opt/7z/7zz
          /opt/7z/7zz i | head -3

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        env:
          YC7ZIP_7Z: /opt/7z/7zz
        run: go test ./... -count=1 -v

      - name: 交叉编译检查
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o /dev/null .
          done

      - name: 校验版本号、通道与 fpk 源文件
        run: |
          set -eu
          # check 会同时校验 VERSION 格式、发布通道与 manifest 的一致性
          python3 tools/version.py check

          v=$(python3 tools/version.py show)
          ch=$(python3 tools/version.py channel)
          echo "版本 $v，通道 $ch"

          # fpk 现在是原生运行（cmd/main 直接拉起包内的二进制），不再走 Docker。
          # 以前这里还比对 app/docker/docker-compose.yaml 的镜像标签，那份文件
          # 随"fpk 去 Docker 化"一起删掉了，检查留着的唯一后果是 CI 常年变红。
          base=deploy/fpk
          for f in manifest ICON.PNG ICON_256.PNG \
                   app/ui/config app/ui/images/icon_64.png app/ui/images/icon_256.png \
                   cmd/main config/privilege config/resource \
                   wizard/install wizard/config; do
            if [ ! -e "$base/$f" ]; then
              echo "缺少 fpk 必需文件：$base/$f"
              exit 1
            fi
          done
          echo "版本号 $v，fpk 源文件齐全"
