name: Release

# 打一个 zip<YY><MM>.<NNN> 标签即发布（例如 zip2609.001）：
# 编译多架构二进制、构建并推送多架构镜像到 Docker Hub 与 GHCR、
# 打包 fnOS fpk 源，最后统一挂到 GitHub Release 上。

on:
  push:
    tags: ['zip*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，形如 zip2609.001；留空则读取 VERSION 文件
        required: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: yc-7zip
  DOCKERHUB_USER: ycyingchen

jobs:
  build:
    name: 编译 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 解析版本号与通道
        id: ver
        run: |
          set -eu
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            v=$(python3 tools/version.py show)
          fi
          # check 会校验 VERSION 格式与 manifest 一致性
          python3 tools/version.py check
          # 标签必须和 VERSION 文件一致，否则 manifest、镜像标签、二进制内版本会各说各话
          file=$(python3 tools/version.py show)
          if [ "$v" != "$file" ]; then
            echo "标签 $v 与 VERSION 文件 $file 不一致" >&2
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$(python3 tools/version.py channel)" >> "$GITHUB_OUTPUT"

      - name: 编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/${{ matrix.arch }}
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.value }} -X main.channel=${{ steps.ver.outputs.channel }}" \
            -o dist/${{ matrix.arch }}/yc7zip .

      - name: 取官方 7-Zip
        run: |
          set -eux
          case "${{ matrix.arch }}" in
            amd64) url=https://www.7-zip.org/a/7z2501-linux-x64.tar.xz ;;
            arm64) url=https://www.7-zip.org/a/7z2501-linux-arm64.tar.xz ;;
          esac
          curl -fsSL -o /tmp/7z.tar.xz "$url"
          tar -xJf /tmp/7z.tar.xz -C "dist/${{ matrix.arch }}" 7zz
          chmod +x "dist/${{ matrix.arch }}/7zz"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error

  docker:
    name: 推送镜像
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: false

      - name: 归位构建上下文
        run: |
          set -eux
          # download-artifact 落成 dist/bin-amd64/... ，Dockerfile 期待 dist/<arch>/...
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            cp dist/bin-$arch/* "dist/$arch/"
          done
          rm -rf dist/bin-*
          find dist -type f | sort

      - name: 解析版本号与通道
        id: ver
        run: |
          set -eu
          echo "value=$(python3 tools/version.py show)" >> "$GITHUB_OUTPUT"
          echo "channel=$(python3 tools/version.py channel)" >> "$GITHUB_OUTPUT"

      - name: 检查 Docker Hub 凭据
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 DOCKERHUB_TOKEN，跳过 Docker Hub 推送。Release 里的二进制与 fpk 不受影响。"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ok == 'true'

      - name: 登录 Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本标签永远打，且不可变；通道标签决定它是否成为 :test 或 :latest
      - name: 计算镜像标签
        id: tags
        run: |
          set -eu
          v="${{ steps.ver.outputs.value }}"
          ch="${{ steps.ver.outputs.channel }}"
          channel_tag=$([ "$ch" = "stable" ] && echo latest || echo test)
          {
            echo "list<<EOF"
            echo "${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:$v"
            echo "${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:$channel_tag"
            echo "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:$v"
            echo "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:$channel_tag"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "通道 $ch -> :$channel_tag"

      - name: 构建并推送
        if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: 跳过说明
        if: steps.creds.outputs.ok != 'true'
        run: |
          echo "本次没有推送镜像（缺少 Docker Hub 凭据）。"
          echo "补上仓库机密 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后重新运行本工作流即可。"

  release:
    name: 发布
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist

      - name: 打包发布件
        run: |
          set -eux
          version=$(python3 tools/version.py show)
          mkdir -p release

          for arch in amd64 arm64; do
            stage="yc-7zip-$version-linux-$arch"
            rm -rf "$stage"; mkdir -p "$stage"
            cp "dist/bin-$arch/yc7zip" "$stage/"
            cp "dist/bin-$arch/7zz"    "$stage/"
            cp README.md CHANGELOG.md "$stage/"
            cp deploy/start.sh deploy/stop.sh "$stage/"
            tar -czf "release/$stage.tar.gz" "$stage"
          done

          # fnOS 的 fpk 里放的是多架构镜像引用，因此只需一个包
          stage="yc-7zip-$version-fpk-src"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -r deploy/fpk "$stage/fpk"
          tar -czf "release/$stage.tar.gz" "$stage"

          # compose 部署要用的文件，单独打个包方便直接下
          mkdir -p release/compose
          cp docker-compose.yml release/compose/
          tar -czf "release/yc-7zip-$version-compose.tar.gz" -C release compose
          rm -rf release/compose

          (cd release && sha256sum ./*.tar.gz > SHA256SUMS.txt)
          ls -la release

      - name: 读取发布通道
        run: echo "channel=$(python3 tools/version.py channel)" >> "$GITHUB_ENV"

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # 测试通道走预发布，正式通道才是一个正常的 Release
          prerelease: ${{ env.channel == 'test' }}
          body: |
            ## YC-7ZIP ${{ github.ref_name }}

            ${{ env.channel == 'test' && '⚠️ **这是测试版**，镜像标签为 `:test`，功能可能继续调整。' || '✅ **正式版**，镜像标签为 `:latest`。' }}

            网页端的压缩与解压工具，直接在 NAS 上读写文件，支持 7z / ZIP / RAR / TAR 等格式，
            并支持**分卷压缩与分卷解压**（飞牛 fnOS 的原生压缩没有分卷）。

            版本号规则：`zip<年份后两位><月份>.<当月修订号>`。

            ### 下载

            | 文件 | 用途 |
            | --- | --- |
            | `yc-7zip-*-linux-amd64.tar.gz` | x86_64 NAS / 服务器，解压后执行 `./start.sh` |
            | `yc-7zip-*-linux-arm64.tar.gz` | ARM64 设备 |
            | `yc-7zip-*-compose.tar.gz` | `docker-compose.yml`（改两行就能用） |
            | `yc-7zip-*-fpk-src.tar.gz` | 飞牛 fnOS 应用包源码，用 `fnpack build` 生成 `.fpk` |

            ### Docker Compose

            ```bash
            # 打开 docker-compose.yml，把要操作的目录换成自己的，然后
            docker compose up -d
            ```

            多架构镜像：`linux/amd64`、`linux/arm64`。

            ### 说明

            - RAR 只能解压：RAR 的压缩算法未开放授权，任何第三方软件都无法生成 `.rar`。
            - 分卷解压时选中任意一卷即可，程序会自动找到第一卷并收集其余分卷。
            - `-allow-root /` 表示放开全部路径；不传则只能上传文件，不能直接读写 NAS。

            完整改动见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
