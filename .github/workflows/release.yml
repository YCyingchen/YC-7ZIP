name: Release

# 打一个 zip<YY><MM>.<NNN> 标签即发布（例如 zip2609.001）：
# 编译多架构二进制、构建并推送多架构镜像到 Docker Hub 与 GHCR、
# 打包 fnOS fpk 源，最后统一挂到 GitHub Release 上。

on:
  push:
    tags: ['zip*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，形如 zip2609.001；留空则读取 VERSION 文件
        required: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: yc-7zip
  DOCKERHUB_USER: ycyingchen

jobs:
  build:
    name: 编译 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: 解析版本号
        id: ver
        run: |
          set -eu
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            v=$(sh deploy/version.sh show)
          fi
          sh deploy/version.sh check
          # 标签必须和 VERSION 文件一致，否则 manifest、镜像标签、二进制内版本会各说各话
          file=$(sh deploy/version.sh show)
          if [ "$v" != "$file" ]; then
            echo "标签 $v 与 VERSION 文件 $file 不一致" >&2
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: 编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/${{ matrix.arch }}
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.value }}" \
            -o dist/${{ matrix.arch }}/yc7zip .

      - name: 取官方 7-Zip
        run: |
          set -eux
          case "${{ matrix.arch }}" in
            amd64) url=https://www.7-zip.org/a/7z2501-linux-x64.tar.xz ;;
            arm64) url=https://www.7-zip.org/a/7z2501-linux-arm64.tar.xz ;;
          esac
          curl -fsSL -o /tmp/7z.tar.xz "$url"
          tar -xJf /tmp/7z.tar.xz -C "dist/${{ matrix.arch }}" 7zz
          chmod +x "dist/${{ matrix.arch }}/7zz"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error

  docker:
    name: 推送镜像
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: false

      - name: 归位构建上下文
        run: |
          set -eux
          # download-artifact 落成 dist/bin-amd64/... ，Dockerfile 期待 dist/<arch>/...
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            cp dist/bin-$arch/* "dist/$arch/"
          done
          rm -rf dist/bin-*
          find dist -type f | sort

      - name: 解析版本号
        id: ver
        run: echo "value=$(sh deploy/version.sh show)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.value }}
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

  release:
    name: 发布
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist

      - name: 打包发布件
        run: |
          set -eux
          version=$(sh deploy/version.sh show)
          mkdir -p release

          for arch in amd64 arm64; do
            stage="yc-7zip-$version-linux-$arch"
            rm -rf "$stage"; mkdir -p "$stage"
            cp "dist/bin-$arch/yc7zip" "$stage/"
            cp "dist/bin-$arch/7zz"    "$stage/"
            cp README.md "$stage/" 2>/dev/null || true
            cp deploy/start.sh deploy/stop.sh "$stage/"
            tar -czf "release/$stage.tar.gz" "$stage"
          done

          # fnOS 的 fpk 里放的是多架构镜像引用，因此只需一个包
          stage="yc-7zip-$version-fpk-src"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -r deploy/fpk "$stage/fpk"
          tar -czf "release/$stage.tar.gz" "$stage"

          (cd release && sha256sum ./*.tar.gz > SHA256SUMS.txt)
          ls -la release

      - name: 生成 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## YC-7ZIP ${{ github.ref_name }}

            网页端的压缩与解压工具，直接在 NAS 上读写文件，支持 7z / ZIP / RAR / TAR 等格式，
            并支持**分卷压缩与分卷解压**（飞牛 fnOS 的原生压缩没有分卷）。

            版本号规则：`zip<年份后两位><月份>.<当月修订号>`。

            ### 下载

            | 文件 | 用途 |
            | --- | --- |
            | `yc-7zip-*-linux-amd64.tar.gz` | x86_64 NAS / 服务器，解压后执行 `./start.sh` |
            | `yc-7zip-*-linux-arm64.tar.gz` | ARM64 设备 |
            | `yc-7zip-*-fpk-src.tar.gz` | 飞牛 fnOS 应用包源码，用 `fnpack build` 生成 `.fpk` |

            ### Docker

            ```
            docker run -d --name yc-7zip -p 8090:8080 \
              -v /vol1:/vol1 \
              ycyingchen/yc-7zip:${{ github.ref_name }} \
              -addr :8080 -data /data -allow-root /vol1
            ```

            多架构镜像：`linux/amd64`、`linux/arm64`。

            ### 说明

            - RAR 只能解压：RAR 的压缩算法未开放授权，任何第三方软件都无法生成 `.rar`。
            - 分卷解压时选中任意一卷即可，程序会自动找到第一卷并收集其余分卷。
            - `-allow-root /` 表示放开全部路径；不传则只能上传文件，不能直接读写 NAS。
