# YC-7ZIP —— 改完这份文件里的值，然后 docker compose up -d
services:
  yc7zip:
    image: ycyingchen/yc-7zip:test   # 版本：正式版用 :latest，也可钉死 :zip2609.006
    container_name: yc-7zip
    restart: unless-stopped
    ports:
      - "8090:8080"                  # 左边是访问端口，可改；右边不要动
    volumes:
      - /vol1/1000:/share            # 改：左边换成你要操作的 NAS 目录，多开就照抄一行
      - ./data:/data                 # 工作区与临时文件，放在这份 compose 文件旁边
    environment:
      YC7ZIP_ALLOW_ROOTS: /share     # 能读写的路径＝上面挂进来的容器内路径，逗号分隔
      # YC7ZIP_AUTH: admin:改我      # 要从局域网之外直接访问端口时才需要
      TZ: Asia/Shanghai
